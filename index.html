<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚛️ ATOM CLASH — Chemistry Battle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap');

:root{
  --void:#060a12;
  --panel:#0d1420;
  --panel-2:#131d2e;
  --panel-3:#1a2740;
  --border:#22314a;
  --text:#e9eef7;
  --muted:#8296b3;
  --cyan:#2ee6cb;
  --cyan-dim:#12463f;
  --gold:#f4b942;
  --danger:#ff5470;
  --violet:#9d8cf7;
  --font-display:'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --font-body:'Inter', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(circle at 15% 10%, rgba(46,230,203,0.07), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(157,140,247,0.08), transparent 45%),
    var(--void);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
}
.app{min-height:100vh; display:flex; flex-direction:column;}

/* ---------- topbar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 26px;
  border-bottom:1px solid var(--border);
  background:rgba(13,20,32,0.7);
  backdrop-filter:blur(6px);
  position:sticky; top:0; z-index:40;
}
.brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; letter-spacing:0.3px;}
.brand .atom-mark{font-size:22px; filter:drop-shadow(0 0 8px rgba(46,230,203,.6));}
.brand-title{font-size:18px;}
.brand-sub{color:var(--muted); font-size:12px; font-weight:500;}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.icon-btn{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  width:40px; height:40px; border-radius:10px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:17px;
  transition:.15s;
}
.icon-btn:hover{border-color:var(--cyan); background:var(--panel-3);}
.icon-btn.active{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset;}

/* ---------- main stage ---------- */
main{flex:1; display:flex; flex-direction:column; align-items:center; padding:26px 18px 60px; position:relative;}
.stage{width:100%; max-width:1180px;}

.eyebrow{color:var(--cyan); font-size:13px; font-weight:600; letter-spacing:.4px;}
h1.hero-title{font-family:var(--font-display); font-size:clamp(28px,4.4vw,52px); margin:6px 0 10px; line-height:1.05;}
.lede{color:var(--muted); font-size:16px; max-width:620px; line-height:1.55;}

/* ---------- start screen ---------- */
.start-wrap{display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:6vh; gap:26px;}
.orbit-hero{position:relative; width:190px; height:190px; margin:0 auto;}
.orbit-hero .nucleus{
  position:absolute; top:50%; left:50%; width:46px; height:46px; margin:-23px 0 0 -23px;
  border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff, var(--cyan) 55%, var(--cyan-dim));
  box-shadow:0 0 40px rgba(46,230,203,.55);
}
.orbit-hero .ring{position:absolute; inset:0; border:1px solid rgba(157,140,247,.35); border-radius:50%;}
.orbit-hero .ring.r2{inset:22px; transform:rotate(35deg);}
.orbit-hero .ring.r3{inset:-14px; transform:rotate(-25deg);}
.orbit-hero .e{position:absolute; width:9px; height:9px; border-radius:50%; background:var(--gold); box-shadow:0 0 10px var(--gold); animation:spin 6s linear infinite;}
.orbit-hero .e1{top:50%; left:-4px; margin-top:-4px; animation-duration:5s;}
.orbit-hero .e2{top:-4px; left:50%; margin-left:-4px; animation-duration:7s; animation-direction:reverse;}
@keyframes spin{from{transform:rotate(0deg) translateX(95px) rotate(0deg);} to{transform:rotate(360deg) translateX(95px) rotate(-360deg);}}

.start-actions{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:6px;}
.btn{
  font-family:var(--font-body); font-weight:700; font-size:15px; cursor:pointer;
  padding:14px 26px; border-radius:12px; border:1px solid transparent; transition:.15s;
}
.btn-primary{background:var(--cyan); color:#04231e; box-shadow:0 8px 24px rgba(46,230,203,.25);}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 30px rgba(46,230,203,.35);}
.btn-ghost{background:transparent; color:var(--text); border-color:var(--border);}
.btn-ghost:hover{border-color:var(--cyan); color:var(--cyan);}
.btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
.btn-danger:hover{background:rgba(255,84,112,.1);}
.btn-gold{background:var(--gold); color:#2b1a02;}
.btn:disabled{opacity:.4; cursor:not-allowed; transform:none !important;}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}

.material-tags{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:640px; margin-top:4px;}
.tag{font-size:12px; color:var(--muted); background:var(--panel-2); border:1px solid var(--border); padding:5px 11px; border-radius:100px;}

/* ---------- team setup ---------- */
.panel{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:22px;}
.team-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-top:18px;}
.team-card{
  background:var(--panel-2); border:1px solid var(--border); border-radius:14px; padding:16px;
  border-left:4px solid var(--team-color, var(--cyan));
}
.team-card label{display:block; font-size:11px; color:var(--muted); margin-bottom:6px; letter-spacing:.3px;}
.team-card input{
  width:100%; background:var(--panel-3); border:1px solid var(--border); color:var(--text);
  padding:10px 11px; border-radius:9px; font-size:15px; font-weight:600; font-family:var(--font-body);
}
.team-card input:focus{outline:none; border-color:var(--team-color, var(--cyan));}

.round-config{margin-top:20px; display:grid; gap:10px;}
.round-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--panel-2); border:1px solid var(--border); padding:12px 16px; border-radius:12px;
}
.round-row .rlabel{display:flex; align-items:center; gap:10px; font-weight:600;}
.round-row .rmeta{color:var(--muted); font-size:12.5px;}
.time-input{width:64px; background:var(--panel-3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 8px; text-align:center;}

/* ---------- round intro ---------- */
.round-intro{text-align:center; padding-top:8vh; display:flex; flex-direction:column; align-items:center; gap:16px;}
.round-badge{font-size:70px; filter:drop-shadow(0 0 20px rgba(46,230,203,.4));}
.round-name{font-family:var(--font-display); font-size:clamp(30px,5vw,58px); margin:0;}
.round-focus{color:var(--muted); max-width:560px;}
.round-stats{display:flex; gap:26px; margin-top:10px; flex-wrap:wrap; justify-content:center;}
.stat-pill{background:var(--panel-2); border:1px solid var(--border); border-radius:100px; padding:8px 18px; font-size:13px; color:var(--muted);}
.stat-pill b{color:var(--text);}

/* ---------- question screen ---------- */
.q-head{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;}
.q-round-chip{display:inline-flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--border); padding:6px 14px; border-radius:100px; font-size:12.5px; color:var(--muted);}
.q-progress{color:var(--muted); font-size:12.5px; margin-top:6px;}

.timer-wrap{display:flex; flex-direction:column; align-items:center; gap:4px;}
.timer{
  font-family:var(--font-display); font-size:44px; font-weight:700; line-height:1;
  padding:8px 22px; border-radius:16px; background:var(--panel-2); border:1px solid var(--border);
  min-width:130px; text-align:center; transition:.2s;
}
.timer.critical{color:var(--danger); border-color:var(--danger); background:rgba(255,84,112,.08); animation:pulse .8s infinite;}
@keyframes pulse{0%,100%{transform:scale(1);} 50%{transform:scale(1.07);}}
.timer-label{font-size:11px; color:var(--muted); letter-spacing:.4px;}

.q-card{
  margin-top:22px; background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:30px;
  position:relative; overflow:hidden;
}
.q-card::before{
  content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
  background:radial-gradient(circle at 90% -10%, rgba(46,230,203,.10), transparent 45%);
}
.q-points{position:absolute; top:22px; right:26px; background:var(--gold); color:#2b1a02; font-weight:800; font-size:13px; padding:6px 13px; border-radius:100px;}
.q-difficulty{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; margin-bottom:10px;}
.q-text{font-size:clamp(19px,2.4vw,25px); font-weight:600; line-height:1.5; max-width:900px;}

/* ---- nuclear notation: A top-left, Z bottom-left, symbol right ---- */
.nuclide{
  display:inline-flex; align-items:center; font-family:var(--font-display); font-weight:800; color:var(--cyan);
  margin:0 8px; white-space:nowrap; vertical-align:middle; line-height:1;
  font-size:1.55em;                 /* notasi jauh lebih besar & dominan, terbaca dari proyektor */
}
.nuclide-az{
  display:inline-flex; flex-direction:column; justify-content:center; align-items:flex-end;
  line-height:0.92; margin-right:5px; gap:2px;
}
.nuclide-a{font-size:0.5em; font-weight:800;}   /* A: nomor massa — kiri atas, tetap besar & jelas */
.nuclide-z{font-size:0.5em; font-weight:800;}   /* Z: nomor atom — kiri bawah, tetap besar & jelas */
.nuclide-sym{font-size:1.2em; font-weight:800;} /* simbol unsur — paling besar & dominan */

.element-card{
  margin-top:18px; display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  width:96px; height:110px; border:1px solid var(--border); border-radius:12px; background:var(--panel-2);
  gap:2px;
}
.element-card .esym{font-family:var(--font-display); font-size:26px; font-weight:700;}
.element-card .ename{font-size:9px; color:var(--muted); letter-spacing:.4px; text-transform:uppercase;}

.options-list{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px; max-width:820px;}
.opt-display{
  background:var(--panel-2); border:1px solid var(--border); border-radius:12px; padding:16px 16px;
  font-size:14.5px; line-height:1.7; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.opt-display .opt-letter{font-family:var(--font-display); font-weight:700; color:var(--cyan); min-width:18px;}

.open-note{
  margin-top:20px; background:var(--panel-2); border:1px dashed var(--border); border-radius:12px; padding:14px 18px;
  color:var(--muted); font-size:13.5px;
}

/* answer progress + all-answered banner */
.answer-progress{
  margin-top:16px; display:inline-flex; align-items:center; gap:8px; background:var(--panel-2);
  border:1px solid var(--border); border-radius:100px; padding:8px 16px; font-size:13px; color:var(--muted);
}
.answer-progress b{color:var(--cyan);}
.all-answered-banner{
  margin-top:16px; background:rgba(46,230,203,.12); border:1px solid var(--cyan); border-radius:14px;
  padding:14px 20px; font-family:var(--font-display); font-weight:700; color:var(--cyan); text-align:center;
  animation:pulse .7s infinite;
}

/* teams answer grid */
.teams-answer-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-top:24px;}
.team-answer-card{
  background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px;
  border-top:3px solid var(--team-color, var(--cyan));
}
.team-answer-card .taname{font-weight:700; font-size:14px; margin-bottom:2px;}
.team-answer-card .tascore{color:var(--muted); font-size:12px; margin-bottom:10px;}
.abcd-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.abcd-btn{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text); border-radius:9px;
  padding:10px 0; font-family:var(--font-display); font-weight:700; font-size:15px; cursor:pointer; transition:.12s;
}
.abcd-btn:hover{border-color:var(--team-color,var(--cyan));}
.abcd-btn.picked{background:var(--team-color, var(--cyan)); color:#04231e; border-color:transparent;}
.abcd-btn:disabled{cursor:not-allowed; opacity:.55;}
.locked-tag{font-size:11px; color:var(--cyan); margin-top:8px; display:flex; align-items:center; gap:5px; font-weight:700;}

.result-badge{font-size:12px; font-weight:700; border-radius:100px; padding:4px 10px; display:inline-block; margin-top:8px;}
.result-badge.correct{background:rgba(46,230,203,.15); color:var(--cyan);}
.result-badge.wrong{background:rgba(255,84,112,.15); color:var(--danger);}
.result-badge.none{background:rgba(130,150,179,.15); color:var(--muted);}

.manual-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-top:24px;}
.manual-card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; border-top:3px solid var(--team-color, var(--cyan));}
.manual-card .mcname{font-weight:700; margin-bottom:2px;}
.manual-card .mcscore{color:var(--muted); font-size:12px; margin-bottom:12px;}
.manual-controls{display:flex; gap:8px;}

.actions-row{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap;}

/* steal zone banner */
.steal-banner{
  margin-top:18px; background:linear-gradient(120deg, rgba(157,140,247,.16), rgba(46,230,203,.08));
  border:1px solid var(--violet); border-radius:14px; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
}
.steal-banner .stitle{font-family:var(--font-display); font-weight:700; color:var(--violet); font-size:17px;}

/* ---------- feedback overlay ---------- */
.feedback-panel{margin-top:22px; border-radius:18px; padding:28px; border:1px solid var(--border); background:var(--panel);}
.feedback-panel.correct{border-color:var(--cyan); box-shadow:0 0 0 1px var(--cyan) inset, 0 0 40px rgba(46,230,203,.12);}
.feedback-panel.wrong{border-color:var(--danger); box-shadow:0 0 0 1px var(--danger) inset, 0 0 40px rgba(255,84,112,.10);}
.feedback-title{font-family:var(--font-display); font-weight:700; font-size:28px; display:flex; align-items:center; gap:10px;}
.feedback-title.correct{color:var(--cyan);}
.feedback-title.wrong{color:var(--danger);}
.feedback-answers{display:flex; gap:22px; margin-top:12px; flex-wrap:wrap; font-size:14px; color:var(--muted);}
.feedback-answers b{color:var(--text);}

/* results table (semua kelompok, serentak) */
.results-table{margin-top:18px; border:1px solid var(--border); border-radius:12px; overflow:hidden;}
.rt-head, .rt-row{display:grid; grid-template-columns:2fr 1fr 1.3fr 1fr; gap:8px; padding:10px 16px; align-items:center;}
.rt-head{background:var(--panel-3); font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700;}
.rt-row{background:var(--panel-2); border-top:1px solid var(--border); border-left:3px solid var(--team-color, var(--cyan)); font-size:14px;}
.rt-team{font-weight:700;}
.rt-ans{font-family:var(--font-display); font-weight:700;}
.rt-result{font-weight:700; font-size:13px;}
.rt-result.correct{color:var(--cyan);}
.rt-result.wrong{color:var(--danger);}
.rt-result.none{color:var(--muted);}
.rt-points{font-family:var(--font-display); font-weight:700; text-align:right;}

.collapse-btn{margin-top:16px;}
.pembahasan{margin-top:14px; background:var(--panel-2); border-radius:12px; padding:16px 18px; border:1px solid var(--border);}
.pembahasan h4{margin:0 0 8px; font-family:var(--font-display); font-size:14px; color:var(--gold); letter-spacing:.3px;}
.pembahasan p{margin:0; line-height:1.65; font-size:14.5px; color:var(--text);}
.pembahasan .formula{font-family:'Space Grotesk',monospace; background:var(--panel-3); display:inline-block; padding:2px 8px; border-radius:6px; margin-top:6px;}

.per-team-results{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:16px;}
.ptr-card{background:var(--panel-2); border-radius:10px; padding:10px 12px; border:1px solid var(--border); border-left:3px solid var(--team-color,var(--cyan));}
.ptr-card .ptrname{font-size:12.5px; font-weight:700;}
.ptr-card .ptrdelta{font-size:12px; margin-top:2px;}
.ptrdelta.pos{color:var(--cyan);}
.ptrdelta.zero{color:var(--muted);}

/* ---------- scoreboard ---------- */
.scoreboard{margin-top:32px;}
.scoreboard h3{font-family:var(--font-display); font-size:15px; letter-spacing:.4px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.leaderboard{display:flex; flex-direction:column; gap:9px;}
.lb-row{
  display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--border);
  border-radius:12px; padding:11px 16px; transition:transform .4s ease;
}
.lb-rank{font-family:var(--font-display); font-weight:700; width:26px; color:var(--muted); font-size:15px;}
.lb-row.rank-1 .lb-rank{color:var(--gold);}
.lb-name{flex:1; font-weight:700; font-size:14.5px;}
.lb-bar-wrap{flex:2; height:8px; background:var(--panel-3); border-radius:100px; overflow:hidden;}
.lb-bar{height:100%; background:var(--team-color, var(--cyan)); border-radius:100px; transition:width .6s ease;}
.lb-score{font-family:var(--font-display); font-weight:700; min-width:52px; text-align:right; font-size:16px;}
.lb-score.bump{animation:bump .5s ease;}
@keyframes bump{0%{transform:scale(1);} 40%{transform:scale(1.35); color:var(--gold);} 100%{transform:scale(1);}}

/* ---------- final results ---------- */
.final-wrap{text-align:center; padding-top:4vh;}
.podium{display:flex; align-items:flex-end; justify-content:center; gap:18px; margin:34px 0 10px; flex-wrap:wrap;}
.podium-slot{display:flex; flex-direction:column; align-items:center; gap:8px;}
.podium-medal{font-size:38px;}
.podium-block{width:150px; border-radius:14px 14px 0 0; background:var(--panel-2); border:1px solid var(--border); padding:16px 10px; display:flex; flex-direction:column; gap:4px;}
.podium-block.gold{height:170px; border-color:var(--gold); box-shadow:0 0 30px rgba(244,185,66,.18);}
.podium-block.silver{height:130px; border-color:#c9d3e0;}
.podium-block.bronze{height:104px; border-color:#c98a4b;}
.podium-name{font-weight:700; font-size:14px;}
.podium-score{font-family:var(--font-display); font-size:20px; color:var(--gold); font-weight:700;}

.export-warning{
  margin-top:22px; background:rgba(255,84,112,.10); border:1px solid var(--danger); color:var(--danger);
  border-radius:12px; padding:12px 18px; font-size:13.5px; font-weight:600; text-align:center;
}
.export-done{
  margin-top:22px; background:rgba(46,230,203,.10); border:1px solid var(--cyan); color:var(--cyan);
  border-radius:12px; padding:12px 18px; font-size:13.5px; font-weight:600; text-align:center;
}
.btn-pulse{animation:pulse 1s infinite; box-shadow:0 0 0 3px rgba(244,185,66,.25);}
.stats-section{margin-top:34px; text-align:left;}
.stats-section h3{font-family:var(--font-display); font-size:15px; color:var(--muted); text-align:center; margin-bottom:14px;}
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
.stat-card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px; border-top:3px solid var(--team-color,var(--cyan));}
.stat-card .scname{font-weight:700; margin-bottom:8px; font-size:15px;}
.stat-card .scrow{display:flex; justify-content:space-between; font-size:13px; color:var(--muted); padding:3px 0;}
.stat-card .scrow b{color:var(--text);}

/* ---------- teacher drawer ---------- */
.drawer-overlay{position:fixed; inset:0; background:rgba(2,5,10,.55); z-index:50; display:none;}
.drawer-overlay.open{display:block;}
.drawer{
  position:fixed; top:0; right:-420px; width:400px; max-width:92vw; height:100%; z-index:60;
  background:var(--panel); border-left:1px solid var(--border); padding:20px; overflow-y:auto;
  transition:right .25s ease;
}
.drawer.open{right:0;}
.drawer h2{font-family:var(--font-display); font-size:18px; display:flex; align-items:center; gap:8px; margin-top:0;}
.drawer-section{margin-top:18px; padding-top:16px; border-top:1px solid var(--border);}
.drawer-section h4{font-size:12px; letter-spacing:.5px; color:var(--muted); text-transform:uppercase; margin:0 0 10px;}
.drawer-btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.drawer-btn-grid .btn{width:100%;}
.drawer-answer-box{background:var(--panel-2); border:1px solid var(--cyan); border-radius:10px; padding:12px; margin-top:10px; font-size:13.5px; line-height:1.5;}
.drawer-answer-box b{color:var(--cyan);}
.team-name-edit{display:flex; gap:6px; margin-bottom:8px;}

<body>
<div class="app">

      <span class="atom-mark">⚛️</span>

<script>
/* =======================================================================
   ATOM CLASH — GAME ENGINE (REVISI)
   Struktur:
   1. DATA (ROUNDS, QUESTIONS)  — bank soal terpisah dari logika
   2. STATE
   3. AUDIO ENGINE (SFX + Background Music — Web Audio API, tanpa file eksternal)
   4. TIMER ENGINE
   5. RENDER / SCREENS
   6. TEACHER CONTROL PANEL + PIN GATE
   7. STATISTIK & EXPORT CSV
   8. INIT
   ======================================================================= */

/* ---------------------------- 1. DATA ---------------------------- */

const TEAM_COLORS = ["#2ee6cb","#f4b942","#9d8cf7","#ff5470","#5fb2ff"];
const TEACHER_PIN = "310526"; // PIN internal — tidak ditampilkan di UI manapun

const ROUNDS = [
  {id:1, key:"rush",      name:"ATOM RUSH",        icon:"⚡", focus:"Nomor atom, nomor massa, proton, neutron, elektron, notasi atom",
    defaultTime:40,  points:10, mode:"mc"},
  {id:2, key:"iso",       name:"ISO BATTLE",       icon:"🧩", focus:"Isotop, isoton, isobar, isoelektron",
    defaultTime:45,  points:15, mode:"mc"},
  {id:3, key:"arlab",     name:"AR LAB",           icon:"🧮", focus:"Massa atom relatif, rata-rata isotop, kelimpahan alami",
    defaultTime:90,  points:20, mode:"mc"},
  {id:4, key:"abundance", name:"ABUNDANCE HUNTER", icon:"🎯", focus:"Mencari kelimpahan isotop berdasarkan Ar",
    defaultTime:120, points:30, mode:"mc"},
  {id:5, key:"steal",     name:"STEAL ZONE",       icon:"⚔️", focus:"Soal uraian — kesempatan curi poin antar kelompok",
    defaultTime:120, points:30, stealPoints:15, mode:"steal"},
  {id:6, key:"final",     name:"FINAL CLASH",      icon:"👑", focus:"Gabungan seluruh materi — soal uraian kompleks",
    defaultTime:150, points:50, mode:"open"},
];

// Helper notasi nuklir standar: A (nomor massa) kiri-atas, Z (nomor atom) kiri-bawah, simbol di kanan.
// Dipakai konsisten di soal, opsi, kartu atom, pembahasan, kunci jawaban, dan Teacher Mode.
function notation(A, Z, sym){
  return `<span class="nuclide"><span class="nuclide-az"><span class="nuclide-a">${A}</span><span class="nuclide-z">${Z}</span></span><span class="nuclide-sym">${sym}</span></span>`;
}

// Bank soal resmi (30 soal). type: "mc" (pilihan ganda) | "open" (uraian, dinilai manual guru)
const QUESTIONS = [

/* ================= ROUND 1 — ATOM RUSH ================= */
{id:1, round:1, type:"mc", difficulty:"easy",
  question:"Atom memiliki nomor atom 11 dan nomor massa 23. Jumlah neutronnya adalah ...",
  options:["11","12","23","34"], correctAnswer:"B",
  explanation:"Jumlah neutron dihitung dengan rumus <span class='formula'>n = A − Z</span>. Substitusi: n = 23 − 11 = <b>12</b>. Jadi jawaban yang benar adalah B."},

{id:2, round:1, type:"mc", difficulty:"easy",
  question:`Diketahui ${notation(27,13,"Al")}. Jumlah proton, neutron, dan elektron atom netral tersebut (berturut-turut p, n, e) adalah ...`,
  options:["13, 14, 13","13, 13, 14","14, 13, 13","27, 13, 14"], correctAnswer:"A",
  explanation:"Z = 13 sehingga proton = 13. Neutron: <span class='formula'>n = A − Z = 27 − 13 = 14</span>. Karena atom netral, elektron = proton = 13. Jadi p=13, n=14, e=13 — jawaban A."},

{id:3, round:1, type:"mc", difficulty:"easy",
  question:"Suatu atom memiliki 15 proton dan 16 neutron. Notasi atomnya adalah ...",
  options:[notation(15,16,"X"), notation(16,15,"X"), notation(31,15,"X"), notation(31,16,"X")], correctAnswer:"C",
  explanation:"Nomor atom = jumlah proton = 15. Nomor massa: <span class='formula'>A = p + n = 15 + 16 = 31</span>. Jadi notasinya "+notation(31,15,"X")+" — jawaban C."},

{id:4, round:1, type:"mc", difficulty:"medium",
  question:"Atom netral mempunyai nomor massa 40 dan 18 elektron. Jumlah neutronnya adalah ...",
  options:["18","22","40","58"], correctAnswer:"B",
  explanation:"Karena atom netral, Z = e = 18. Neutron: <span class='formula'>n = A − Z = 40 − 18 = 22</span>. Jawaban B."},

{id:5, round:1, type:"mc", difficulty:"easy",
  question:`Diketahui ${notation(39,19,"K")}. Jumlah proton, neutron, dan elektron berturut-turut adalah ...`,
  options:["19, 20, 19","19, 19, 20","20, 19, 20","39, 19, 20"], correctAnswer:"A",
  explanation:"p = Z = 19. n = A − Z = 39 − 19 = 20. Karena netral, e = 19. Jadi p=19, n=20, e=19 — jawaban A."},

{id:6, round:1, type:"mc", difficulty:"medium",
  question:"Suatu atom memiliki 20 proton dan 20 neutron. Notasi atomnya adalah ...",
  options:[notation(20,20,"X"), notation(40,20,"X"), notation(40,40,"X"), notation(20,40,"X")], correctAnswer:"B",
  explanation:"Z = proton = 20. A = p + n = 20 + 20 = 40. Notasinya "+notation(40,20,"X")+" — jawaban B."},

/* ================= ROUND 2 — ISO BATTLE ================= */
{id:7, round:2, type:"mc", difficulty:"medium",
  question:"Pasangan berikut yang merupakan isotop adalah ...",
  options:[
    notation(23,11,"Na")+" dan "+notation(24,12,"Mg"),
    notation(23,11,"Na")+" dan "+notation(24,11,"Na"),
    notation(24,12,"Mg")+" dan "+notation(25,13,"Al"),
    notation(35,17,"Cl")+" dan "+notation(36,18,"Ar")
  ], correctAnswer:"B",
  explanation:"Isotop memiliki nomor atom (Z) sama tetapi nomor massa (A) berbeda. Pada opsi B, kedua atom sama-sama Na dengan Z = 11, namun A berbeda (23 dan 24). Jadi keduanya adalah isotop — jawaban B."},

{id:8, round:2, type:"mc", difficulty:"medium",
  question:"Pasangan berikut yang merupakan isoton adalah ...",
  options:[
    notation(23,11,"Na")+" dan "+notation(24,12,"Mg"),
    notation(23,11,"Na")+" dan "+notation(24,11,"Na"),
    notation(24,12,"Mg")+" dan "+notation(25,12,"Mg"),
    notation(35,17,"Cl")+" dan "+notation(37,17,"Cl")
  ], correctAnswer:"A",
  explanation:"Isoton memiliki jumlah neutron sama. Na: n = 23 − 11 = 12. Mg: n = 24 − 12 = 12. Neutron sama (12), sehingga keduanya isoton — jawaban A."},

{id:9, round:2, type:"mc", difficulty:"medium",
  question:"Pasangan yang merupakan isobar adalah ...",
  options:[
    notation(35,17,"Cl")+" dan "+notation(37,17,"Cl"),
    notation(23,11,"Na")+" dan "+notation(24,12,"Mg"),
    notation(40,18,"Ar")+" dan "+notation(40,20,"Ca"),
    notation(12,6,"C")+" dan "+notation(13,6,"C")
  ], correctAnswer:"C",
  explanation:"Isobar memiliki nomor massa (A) sama tetapi nomor atom (Z) berbeda. Ar dan Ca sama-sama A = 40, sedangkan Z berbeda (18 dan 20) — jawaban C."},

{id:10, round:2, type:"mc", difficulty:"medium",
  question:"Pasangan yang memiliki jumlah elektron sama (isoelektron) adalah ...",
  options:["Na dan Mg","Na⁺ dan Ne","Na⁺ dan Mg⁺","Cl⁻ dan Ar⁺"], correctAnswer:"B",
  explanation:"Na memiliki Z = 11. Na⁺ kehilangan 1 elektron: e = 11 − 1 = 10. Ne memiliki 10 elektron. Karena jumlah elektronnya sama, Na⁺ dan Ne adalah isoelektron — jawaban B."},

{id:11, round:2, type:"mc", difficulty:"easy",
  question:`Perhatikan ${notation(40,18,"Ar")} dan ${notation(40,20,"Ca")}. Hubungan kedua atom tersebut adalah ...`,
  options:["Isotop","Isoton","Isobar","Isoelektron"], correctAnswer:"C",
  explanation:"Nomor massa keduanya sama (A = 40) sedangkan nomor atom berbeda (18 dan 20). Maka hubungan keduanya adalah isobar — jawaban C."},

{id:12, round:2, type:"mc", difficulty:"hard",
  question:`Perhatikan tiga atom berikut:<br>X = ${notation(35,17,"Cl")}, Y = ${notation(37,17,"Cl")}, Z = ${notation(36,18,"Ar")}.<br>Pernyataan yang benar adalah ...`,
  options:["X dan Y adalah isotop","Y dan Z adalah isobar","X dan Z adalah isotop","X dan Z memiliki jumlah proton sama"], correctAnswer:"A",
  explanation:"X dan Y sama-sama memiliki Z = 17 (proton sama) tetapi nomor massanya berbeda (35 dan 37), sehingga X dan Y adalah isotop — jawaban A."},

/* ================= ROUND 3 — AR LAB ================= */
{id:13, round:3, type:"mc", difficulty:"medium",
  question:"Unsur X memiliki dua isotop: X-10 = 20% dan X-11 = 80%. Jika nomor massa digunakan sebagai pendekatan massa isotop, Ar X adalah ...",
  options:["10,2","10,5","10,8","11,0"], correctAnswer:"C",
  explanation:"<span class='formula'>Ar = (10 × 0,20) + (11 × 0,80) = 2 + 8,8 = 10,8</span>. Jawaban C."},

{id:14, round:3, type:"mc", difficulty:"medium",
  question:"X-20 = 40% dan X-22 = 60%. Ar X berdasarkan nomor massa adalah ...",
  options:["20,4","20,8","21,0","21,2"], correctAnswer:"D",
  explanation:"<span class='formula'>Ar = (20 × 0,40) + (22 × 0,60) = 8 + 13,2 = 21,2</span>. Jawaban D."},

{id:15, round:3, type:"mc", difficulty:"medium",
  question:"Suatu unsur mempunyai X-10 = 10%, X-11 = 20%, X-12 = 70%. Ar berdasarkan nomor massa adalah ...",
  options:["11,2","11,4","11,6","11,8"], correctAnswer:"C",
  explanation:"<span class='formula'>Ar = (10×0,10)+(11×0,20)+(12×0,70) = 1 + 2,2 + 8,4 = 11,6</span>. Jawaban C."},

{id:16, round:3, type:"mc", difficulty:"medium",
  question:`Klorin alami memiliki ${notation(35,17,"Cl")} sekitar 75,76% dan ${notation(37,17,"Cl")} sekitar 24,24%. Jika nomor massa digunakan sebagai pendekatan massa isotop, hitung Ar Cl.`,
  options:["35,24","35,48","35,76","36,24"], correctAnswer:"B",
  explanation:"<span class='formula'>Ar = (35×0,7576)+(37×0,2424) = 26,516 + 8,9688 = 35,4848 ≈ 35,48</span>. Catatan: hasil ini adalah pendekatan karena menggunakan nomor massa sebagai massa isotop. Jawaban B."},

{id:17, round:3, type:"mc", difficulty:"hard",
  question:`Magnesium memiliki isotop alami: ${notation(24,12,"Mg")} = 78,99%, ${notation(25,12,"Mg")} = 10,00%, ${notation(26,12,"Mg")} = 11,01%. Jika nomor massa digunakan sebagai pendekatan massa isotop, Ar Mg adalah ...`,
  options:["24,10","24,32","24,50","25,00"], correctAnswer:"B",
  explanation:"<span class='formula'>Ar = (24×0,7899)+(25×0,1000)+(26×0,1101) = 18,9576+2,5+2,8626 = 24,3202 ≈ 24,32</span>. Jawaban B."},

{id:18, round:3, type:"mc", difficulty:"hard",
  question:`Data isotop alami Zn: ${notation(64,30,"Zn")} = 49,17%, ${notation(66,30,"Zn")} = 27,73%, ${notation(67,30,"Zn")} = 4,04%, ${notation(68,30,"Zn")} = 18,45%, ${notation(70,30,"Zn")} = 0,61%. Jika nomor massa digunakan sebagai pendekatan massa isotop, Ar Zn adalah ...`,
  options:["64,38","65,00","65,38","65,45"], correctAnswer:"D",
  explanation:"<span class='formula'>Ar = 64(0,4917)+66(0,2773)+67(0,0404)+68(0,1845)+70(0,0061)</span><br>= 31,4688+18,3018+2,7068+12,546+0,427 = <b>65,4504 ≈ 65,45</b>. Catatan: nilai 65,38 adalah Ar Zn sebenarnya (dihitung dari massa isotop asli, bukan nomor massa bulat) — karena soal ini memakai pendekatan nomor massa, jawaban yang konsisten adalah 65,45. Jawaban D."},

/* ================= ROUND 4 — ABUNDANCE HUNTER ================= */
{id:19, round:4, type:"mc", difficulty:"medium",
  question:"Unsur X mempunyai isotop X-10 dan X-11. Ar X = 10,8. Kelimpahan X-10 adalah ...",
  options:["20%","30%","70%","80%"], correctAnswer:"A",
  explanation:"Misalkan kelimpahan X-10 = x, maka X-11 = 1 − x.<br><span class='formula'>10x + 11(1−x) = 10,8 → 11 − x = 10,8 → x = 0,2</span> = <b>20%</b>. Jawaban A."},

{id:20, round:4, type:"mc", difficulty:"medium",
  question:"Unsur X mempunyai isotop X-20 dan X-22. Ar X = 21,2. Kelimpahan X-20 adalah ...",
  options:["20%","30%","40%","60%"], correctAnswer:"C",
  explanation:"Misalkan X-20 = x, X-22 = 1 − x.<br><span class='formula'>20x + 22(1−x) = 21,2 → 22 − 2x = 21,2 → x = 0,4</span> = <b>40%</b>. Jawaban C."},

{id:21, round:4, type:"mc", difficulty:"hard",
  question:"Unsur X mempunyai isotop X-35 dan X-37. Ar pendekatan = 35,5. Kelimpahan X-35 adalah ...",
  options:["25%","50%","75%","80%"], correctAnswer:"C",
  explanation:"Misalkan X-35 = x, X-37 = 1 − x.<br><span class='formula'>35x + 37(1−x) = 35,5 → 37 − 2x = 35,5 → x = 0,75</span> = <b>75%</b>. Jawaban C."},

{id:22, round:4, type:"mc", difficulty:"hard",
  question:"Unsur X mempunyai isotop X-24 dan X-26. Ar pendekatan = 24,2. Kelimpahan X-26 adalah ...",
  options:["10%","20%","80%","90%"], correctAnswer:"A",
  explanation:"Misalkan X-26 = x, X-24 = 1 − x.<br><span class='formula'>24(1−x) + 26x = 24,2 → 24 + 2x = 24,2 → x = 0,1</span> = <b>10%</b>. Jawaban A."},

/* ================= ROUND 5 — STEAL ZONE (uraian) ================= */
{id:23, round:5, type:"open", difficulty:"medium",
  question:`Diberikan ${notation(35,17,"Cl")} dan ${notation(37,17,"Cl")}. Tentukan: (1) jumlah proton masing-masing, (2) jumlah neutron masing-masing, (3) hubungan keduanya.`,
  answerKey:`${notation(35,17,"Cl")}: p = 17, n = 18 &nbsp;•&nbsp; ${notation(37,17,"Cl")}: p = 17, n = 20 &nbsp;•&nbsp; Hubungan: <b>Isotop</b>`,
  explanation:"Kedua atom memiliki Z yang sama (17) sehingga jumlah proton sama. Namun nomor massanya berbeda (35 dan 37), sehingga keduanya adalah isotop. Neutron: n = A − Z → 35−17=18 dan 37−17=20."},

{id:24, round:5, type:"open", difficulty:"medium",
  question:`Diberikan X = ${notation(23,11,"Na")}, Y = ${notation(24,12,"Mg")}, Z = ${notation(24,11,"Na")}. Tentukan pasangan isotop dan pasangan isoton.`,
  answerKey:`Isotop: <b>X dan Z</b> &nbsp;•&nbsp; Isoton: <b>X dan Y</b>`,
  explanation:"Neutron X = 23−11=12, Y = 24−12=12, Z = 24−11=13. X dan Z memiliki Z sama (11) tapi A berbeda → isotop. X dan Y memiliki neutron sama (12) → isoton."},

{id:25, round:5, type:"open", difficulty:"medium",
  question:"Sebuah atom netral memiliki 19 elektron dan nomor massa 39. Tentukan Z, p, n, e, dan notasi atomnya.",
  answerKey:`Z = 19, p = 19, n = 20, e = 19, notasi = ${notation(39,19,"K")}`,
  explanation:"Atom netral memiliki jumlah proton dan elektron sama. Karena e = 19, maka Z = p = 19. Neutron: n = 39 − 19 = 20. Unsur dengan Z = 19 adalah Kalium (K)."},

{id:26, round:5, type:"open", difficulty:"hard",
  question:"Dua isotop suatu unsur mempunyai nomor massa 10 dan 11. Jika isotop nomor massa 10 mempunyai kelimpahan 30%, tentukan Ar pendekatan unsur tersebut.",
  answerKey:"Ar ≈ <b>10,7</b>",
  explanation:"Kelimpahan X-11 = 100% − 30% = 70%.<br><span class='formula'>Ar = (10×0,30)+(11×0,70) = 3 + 7,7 = 10,7</span>."},

/* ================= ROUND 6 — FINAL CLASH (uraian gabungan) ================= */
{id:27, round:6, type:"open", difficulty:"hard",
  question:`Diberikan ${notation(35,17,"Cl")}. Tentukan Z, A, p, n, dan e.`,
  answerKey:"Z = 17, A = 35, p = 17, n = 18, e = 17",
  explanation:"Angka atas adalah nomor massa (A), angka bawah adalah nomor atom (Z). p = Z = 17. Karena atom netral, e = 17. Neutron: n = A − Z = 35 − 17 = 18."},

{id:28, round:6, type:"open", difficulty:"hard",
  question:`Diberikan X = ${notation(23,11,"Na")}, Y = ${notation(24,12,"Mg")}, Z = ${notation(24,11,"Na")}. Tentukan hubungan: (a) X dengan Z, (b) X dengan Y, (c) Y dengan Z.`,
  answerKey:"X–Z = Isotop &nbsp;•&nbsp; X–Y = Isoton &nbsp;•&nbsp; Y–Z = Isobar",
  explanation:"X dan Z: Z sama (11), A berbeda → isotop. X dan Y: neutron sama-sama 12 → isoton. Y dan Z: sama-sama A = 24, Z berbeda → isobar."},

{id:29, round:6, type:"open", difficulty:"hard",
  question:`Klorin memiliki ${notation(35,17,"Cl")} = 75,76% dan ${notation(37,17,"Cl")} = 24,24%. Tentukan: (1) neutron ${notation(35,17,"Cl")}, (2) neutron ${notation(37,17,"Cl")}, (3) hubungan keduanya, (4) Ar dengan nomor massa sebagai pendekatan.`,
  answerKey:`n(${notation(35,17,"Cl")}) = 18 &nbsp;•&nbsp; n(${notation(37,17,"Cl")}) = 20 &nbsp;•&nbsp; Hubungan: Isotop &nbsp;•&nbsp; Ar ≈ 35,48`,
  explanation:`Nomor atom Cl = 17. n(${notation(35,17,"Cl")}) = 35−17=18, n(${notation(37,17,"Cl")}) = 37−17=20. Keduanya isotop (Z sama, A beda). Ar = 35(0,7576)+37(0,2424) = 35,4848 ≈ 35,48.`},

{id:30, round:6, type:"open", difficulty:"hard",
  question:`ULTIMATE ATOM CLASH — Data isotop Zn: ${notation(64,30,"Zn")}=49,17%, ${notation(66,30,"Zn")}=27,73%, ${notation(67,30,"Zn")}=4,04%, ${notation(68,30,"Zn")}=18,45%, ${notation(70,30,"Zn")}=0,61%. Tentukan: (a) neutron ${notation(64,30,"Zn")}, (b) neutron ${notation(68,30,"Zn")}, (c) hubungan ${notation(64,30,"Zn")} dan ${notation(68,30,"Zn")}, (d) Ar Zn (pendekatan nomor massa).`,
  answerKey:"(a) 34 neutron &nbsp;•&nbsp; (b) 38 neutron &nbsp;•&nbsp; (c) Isotop &nbsp;•&nbsp; (d) Ar ≈ 65,45",
  explanation:`Nomor atom Zn = 30. n(${notation(64,30,"Zn")})=64−30=34, n(${notation(68,30,"Zn")})=68−30=38 → keduanya isotop (Z sama, A beda). Ar = 64(0,4917)+66(0,2773)+67(0,0404)+68(0,1845)+70(0,0061) ≈ 65,45 (dengan pendekatan nomor massa).`},
];

/* ---------------------------- 2. STATE ---------------------------- */

const state = {
  screen: "start",             // start | teams | roundIntro | question | feedback | final
  teams: [
    {id:0, name:"Kelompok 1", score:0, color:TEAM_COLORS[0]},
    {id:1, name:"Kelompok 2", score:0, color:TEAM_COLORS[1]},
    {id:2, name:"Kelompok 3", score:0, color:TEAM_COLORS[2]},
    {id:3, name:"Kelompok 4", score:0, color:TEAM_COLORS[3]},
    {id:4, name:"Kelompok 5", score:0, color:TEAM_COLORS[4]},
  ],
  roundTimeOverrides: {},       // roundId -> seconds
  currentRoundIdx: 0,
  currentQIdxInRound: 0,        // index within the round's question list
  answers: {},                  // teamId -> letter (for mc) — TERKUNCI begitu terisi
  locked: false,
  revealed: false,
  lastDeltas: {},                // teamId -> points gained this question (for feedback display)
  timer: {seconds:0, total:0, running:false, intervalId:null},
  soundOn: true,
  audioCtx: null,
  teacherOpen: false,
  teacherAuthed: false,          // PIN sudah benar sekali → tetap terbuka aksesnya selama sesi ini
  pembahasanOpen: false,         // toggle collapse pembahasan di layar feedback
  allAnsweredFlag: false,        // banner "SEMUA JAWABAN TERKUNCI"
  manualGraded: {},              // teamId -> true, untuk round open/final agar tidak dinilai dua kali
  history: [],                   // rekam jejak setiap keputusan skor untuk statistik akhir
  stealPhase: "main",            // main | judgeMain | open | judgeSteal | done
  stealMainTeam: null,
  stealAttemptTeam: null,
  stealResult: null,             // {main: bool|null, steal: bool|null}
  gameStarted: false,
  resultsExported: false,        // true setelah guru menekan Export Hasil (CSV) di layar akhir
};

function questionsForRound(roundId){ return QUESTIONS.filter(q => q.round === roundId); }
function currentRound(){ return ROUNDS[state.currentRoundIdx]; }
function currentRoundQuestions(){ return questionsForRound(currentRound().id); }
function currentQuestion(){ return currentRoundQuestions()[state.currentQIdxInRound]; }
function roundTimeLimit(round){ return state.roundTimeOverrides[round.id] || round.defaultTime; }

function pushHistory(teamId, result, points, isSteal){
  state.history.push({round: currentRound().id, teamId, result, points: points||0, isSteal: !!isSteal});
}

function resetPerQuestionState(){
  state.answers = {}; state.locked=false; state.revealed=false; state.lastDeltas={};
  state.allAnsweredFlag=false; state.manualGraded={}; state.pembahasanOpen=false;
  state.stealPhase="main"; state.stealMainTeam=null; state.stealAttemptTeam=null; state.stealResult=null;
}

/* ---------------------------- 3. AUDIO ENGINE ---------------------------- */

function ensureAudio(){
  if(!state.audioCtx){
    try{ state.audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(state.audioCtx && state.audioCtx.state === "suspended"){ state.audioCtx.resume(); }
}

function tone(freq, duration, type="sine", startGain=0.16, delay=0){
  if(!state.soundOn || !state.audioCtx) return;
  const ctx = state.audioCtx;
  const t0 = ctx.currentTime + delay;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type; osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(startGain, t0);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0); osc.stop(t0 + duration + 0.02);
}

const SFX = {
  click(){ tone(520, 0.06, "square", 0.08); },
  correct(){ tone(523.25,0.14,"sine",0.18); tone(659.25,0.16,"sine",0.16,0.09); tone(783.99,0.22,"sine",0.16,0.18); },
  wrong(){ tone(220,0.22,"sawtooth",0.14); tone(164,0.28,"sawtooth",0.12,0.10); },
  timeout(){ tone(300,0.2,"square",0.15); tone(150,0.35,"square",0.16,0.15); },
  countdown(){ tone(880,0.09,"square",0.14); },
  victory(){ [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,0.28,"sine",0.16,i*0.14)); },
};

function playSfx(name){ ensureAudio(); if(SFX[name]) SFX[name](); }

/* ---- Background music: ambient pad loop, terpisah dari SFX, volume rendah ---- */
const BG_CHORDS = [
  [220.00,277.18,329.63],   // Am
  [196.00,246.94,293.66],   // Gsus-ish
  [174.61,220.00,261.63],   // F
  [196.00,246.94,329.63],   // G
];
const bgMusic = {intervalId:null, chordIdx:0, playing:false};

function playPad(freqs, duration){
  if(!state.soundOn || !state.audioCtx) return;
  freqs.forEach((f,i)=>tone(f, duration, "sine", 0.032, i*0.03));
}
function startBgMusic(){
  if(bgMusic.playing || !state.soundOn) return;
  ensureAudio();
  if(!state.audioCtx) return;
  bgMusic.playing = true;
  const beatMs = 1900; // ambien, santai, tidak mengganggu suara guru
  playPad(BG_CHORDS[bgMusic.chordIdx], 2.0);
  bgMusic.intervalId = setInterval(()=>{
    bgMusic.chordIdx = (bgMusic.chordIdx+1) % BG_CHORDS.length;
    playPad(BG_CHORDS[bgMusic.chordIdx], 2.0);
  }, beatMs);
}
function stopBgMusic(){
  if(bgMusic.intervalId) clearInterval(bgMusic.intervalId);
  bgMusic.intervalId = null;
  bgMusic.playing = false;
}
function duckMusicForTimeout(){
  stopBgMusic();
  setTimeout(()=>{ if(state.soundOn) startBgMusic(); }, 1600);
}

/* ---------------------------- 4. TIMER ENGINE ---------------------------- */

function startTimer(seconds, onTick, onComplete){
  stopTimer();
  state.timer.seconds = seconds;
  state.timer.total = seconds;
  state.timer.running = true;
  onTick(state.timer.seconds);
  state.timer.intervalId = setInterval(()=>{
    state.timer.seconds -= 1;
    if(state.timer.seconds <= 10 && state.timer.seconds > 0){ playSfx("countdown"); }
    onTick(state.timer.seconds);
    if(state.timer.seconds <= 0){
      stopTimer();
      playSfx("timeout");
      duckMusicForTimeout();
      onComplete();
    }
  }, 1000);
}
function pauseTimer(){
  if(state.timer.intervalId){ clearInterval(state.timer.intervalId); state.timer.intervalId=null; state.timer.running=false; }
  stopBgMusic();
}
function resumeTimer(onTick, onComplete){
  if(state.timer.running || state.timer.seconds<=0) return;
  state.timer.running = true;
  if(state.soundOn) startBgMusic();
  state.timer.intervalId = setInterval(()=>{
    state.timer.seconds -= 1;
    if(state.timer.seconds <= 10 && state.timer.seconds > 0){ playSfx("countdown"); }
    onTick(state.timer.seconds);
    if(state.timer.seconds <= 0){ stopTimer(); playSfx("timeout"); duckMusicForTimeout(); onComplete(); }
  }, 1000);
}
function stopTimer(){ if(state.timer.intervalId){ clearInterval(state.timer.intervalId); } state.timer.intervalId=null; state.timer.running=false; }
function fmtTime(s){ s=Math.max(0,s); const m=Math.floor(s/60), sec=s%60; return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0"); }

  if(mw) mw.onclick = ()=>{

      playSfx("click"); renderQuestion();

  };

    state.lastDeltas[state.stealAttemptTeam]=0;

    playSfx("wrong"); renderQuestion();
  };

function lockAndEvaluate(){
  if(state.locked) return;
  stopTimer();
  state.locked = true;
  state.allAnsweredFlag = false;
  const r = currentRound();
  const q = currentQuestion();

  if(r.mode==="mc"){
    let anyCorrect=false;
    state.teams.forEach(t=>{
      const ans = state.answers[t.id];
      if(ans === undefined){
        state.lastDeltas[t.id]=0;
        pushHistory(t.id, "unanswered", 0, false);
      } else if(ans === q.correctAnswer){
        const pts=q.points||r.points; t.score+=pts; state.lastDeltas[t.id]=pts; anyCorrect=true;
        pushHistory(t.id, "correct", pts, false);
      } else {
        state.lastDeltas[t.id]=0;
        pushHistory(t.id, "wrong", 0, false);
      }
    });
    playSfx(anyCorrect ? "correct" : "wrong");
  }
  // untuk mode "open" dan "steal", skor sudah ditentukan manual oleh guru sebelum tombol ini ditekan
  state.revealed = true;
  state.screen = "feedback";
  render();
}

function renderFeedback(){
  const r = currentRound();
  const q = currentQuestion();
  const anyCorrect = Object.values(state.lastDeltas).some(v=>v>0);
  const cls = anyCorrect ? "correct" : "wrong";

  let answersLine = "";
  let resultsTableHTML = "";
  if(r.mode==="mc"){
    answersLine = `<div class="feedback-answers"><span>Kunci Jawaban: <b>${q.correctAnswer}. ${q.options["ABCD".indexOf(q.correctAnswer)]}</b></span></div>`;
    resultsTableHTML = `<div class="results-table">
      <div class="rt-head"><span>Kelompok</span><span>Jawaban</span><span>Hasil</span><span>Poin</span></div>
      ${state.teams.map(t=>{
        const ans = state.answers[t.id];
        const answered = ans !== undefined;
        const isCorrect = state.lastDeltas[t.id] > 0;
        return `<div class="rt-row" style="--team-color:${t.color}">
          <span class="rt-team">${t.name}</span>
          <span class="rt-ans">${answered ? ans : "—"}</span>
          <span class="rt-result ${isCorrect?"correct":(answered?"wrong":"none")}">${isCorrect?"✓ BENAR":(answered?"✗ SALAH":"– Tidak Menjawab")}</span>
          <span class="rt-points">${isCorrect ? "+"+state.lastDeltas[t.id] : "+0"}</span>
        </div>`;
      }).join("")}
    </div>`;
  } else if(q.answerKey){
    answersLine = `<div class="feedback-answers"><span>Kunci: <b>${q.answerKey}</b></span></div>`;
    resultsTableHTML = `<div class="per-team-results">
      ${state.teams.map(t=>`
        <div class="ptr-card" style="--team-color:${t.color}">
          <div class="ptrname">${t.name}</div>
          <div class="ptrdelta ${state.lastDeltas[t.id]>0?"pos":"zero"}">${t.id in state.lastDeltas ? (state.lastDeltas[t.id]>0 ? "+"+state.lastDeltas[t.id]+" poin" : "0 poin") : "belum dinilai"}</div>
        </div>`).join("")}
    </div>`;
  }

  root.innerHTML = `
    <div class="q-round-chip">${r.icon} ${r.name}</div>
    <div class="feedback-panel ${cls}">
      <div class="feedback-title ${cls}">${anyCorrect ? "✅ BENAR!" : "❌ BELUM TEPAT"}</div>
      ${answersLine}
      ${resultsTableHTML}
      <button class="btn btn-ghost btn-sm collapse-btn" id="togglePembahasanBtn">${state.pembahasanOpen ? "📖 Sembunyikan Pembahasan ▲" : "📖 Lihat Pembahasan ▼"}</button>
      ${state.pembahasanOpen ? `<div class="pembahasan"><h4>📘 PEMBAHASAN</h4><p>${q.explanation}</p></div>` : ""}
    </div>
    <div class="actions-row">
      <button class="btn btn-primary" id="nextQBtn">➡️ Soal Berikutnya</button>
    </div>
    ${renderMiniScoreboardHTML(true)}
  `;
  document.getElementById("togglePembahasanBtn").onclick = ()=>{
    state.pembahasanOpen = !state.pembahasanOpen;
    playSfx("click");
    renderFeedback();
  };
  document.getElementById("nextQBtn").onclick = ()=>{
    playSfx("click");
    goToNextQuestion();
  };
}

function goToNextQuestion(){
  const qs = currentRoundQuestions();
  state.currentQIdxInRound += 1;
  resetPerQuestionState();

  if(state.currentQIdxInRound >= qs.length){
    // ronde selesai -> ronde berikutnya atau final
    if(state.currentRoundIdx+1 >= ROUNDS.length){
      stopBgMusic();
      state.screen = "final";
      playSfx("victory");
      render();
      return;
    } else {
      state.currentRoundIdx += 1;
      state.currentQIdxInRound = 0;
      state.screen = "roundIntro";
      render();
      return;
    }
  }
  state.screen = "question";
  render();
  beginQuestionTimer();
}

function renderMiniScoreboardHTML(bumped){
  const sorted = [...state.teams].sort((a,b)=>b.score-a.score);
  const max = Math.max(1, ...sorted.map(t=>t.score));
  return `<div class="scoreboard">
    <h3>🏆 LEADERBOARD</h3>
    <div class="leaderboard">
      ${sorted.map((t,i)=>`
        <div class="lb-row ${i===0?"rank-1":""}">
          <div class="lb-rank">${i+1}</div>
          <div class="lb-name">${t.name}</div>
          <div class="lb-bar-wrap"><div class="lb-bar" style="width:${(t.score/max*100)||0}%; --team-color:${t.color}"></div></div>
          <div class="lb-score ${bumped && state.lastDeltas[t.id]>0 ? "bump":""}">${t.score}</div>
        </div>`).join("")}
    </div>
  </div>`;
}

/* ---------------------------- 7. STATISTIK & EXPORT CSV ---------------------------- */

function computeStats(teamId){
  const entries = state.history.filter(h=>h.teamId===teamId);
  const correct = entries.filter(e=>e.result==="correct").length;
  const wrong = entries.filter(e=>e.result==="wrong").length;
  const unanswered = entries.filter(e=>e.result==="unanswered").length;
  const total = correct+wrong+unanswered;
  const accuracy = total ? ((correct/total)*100).toFixed(1) : "0.0";
  const stealPoints = entries.filter(e=>e.isSteal && e.result==="correct").reduce((s,e)=>s+e.points,0);
  return {correct, wrong, unanswered, accuracy, stealPoints};
}

function exportCSV(){
  const rows = [["Kelompok","Skor Akhir","Benar","Salah","Tidak Menjawab","Poin Steal"]];
  state.teams.forEach(t=>{
    const s = computeStats(t.id);
    rows.push([t.name, t.score, s.correct, s.wrong, s.unanswered, s.stealPoints]);
  });
  const csv = rows.map(r=>r.join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "atom_clash_hasil.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.resultsExported = true;
}

function renderFinal(){
  const sorted = [...state.teams].sort((a,b)=>b.score-a.score);
  const [g,s,b] = sorted;
  root.innerHTML = `
    <div class="final-wrap">
      <div class="eyebrow">GAME SELESAI</div>
      <h1 class="hero-title">🏆 ATOM CHAMPION</h1>
      <div class="podium">
        ${s ? `<div class="podium-slot"><div class="podium-medal">🥈</div><div class="podium-block silver"><div class="podium-name">${s.name}</div><div class="podium-score">${s.score}</div></div></div>`:""}
        ${g ? `<div class="podium-slot"><div class="podium-medal">🥇</div><div class="podium-block gold"><div class="podium-name">${g.name}</div><div class="podium-score">${g.score}</div></div></div>`:""}
        ${b ? `<div class="podium-slot"><div class="podium-medal">🥉</div><div class="podium-block bronze"><div class="podium-name">${b.name}</div><div class="podium-score">${b.score}</div></div></div>`:""}
      </div>
      ${renderMiniScoreboardHTML()}

      <div class="stats-section">
        <h3>📊 STATISTIK AKHIR</h3>
        <div class="stats-grid">
          ${state.teams.map(t=>{
            const s2 = computeStats(t.id);
            return `<div class="stat-card" style="--team-color:${t.color}">
              <div class="scname">${t.name}</div>
              <div class="scrow"><span>Benar</span><b>${s2.correct}</b></div>
              <div class="scrow"><span>Salah</span><b>${s2.wrong}</b></div>
              <div class="scrow"><span>Tidak menjawab</span><b>${s2.unanswered}</b></div>
              <div class="scrow"><span>Akurasi</span><b>${s2.accuracy}%</b></div>
              <div class="scrow"><span>Poin dari Steal</span><b>+${s2.stealPoints}</b></div>
            </div>`;
          }).join("")}
        </div>
      </div>

      ${!state.resultsExported ? `<div class="export-warning">⚠️ Hasil belum disimpan — klik "Export Hasil (CSV)" dulu sebelum keluar, atau skor akan hilang.</div>` : `<div class="export-done">✅ Hasil sudah diexport ke CSV.</div>`}

      <div class="actions-row" style="justify-content:center;margin-top:18px;">
        <button class="btn btn-gold ${!state.resultsExported ? "btn-pulse" : ""}" id="exportCsvBtn">📥 Export Hasil (CSV)</button>
        <button class="btn btn-primary" id="playAgainBtn">🔄 Main Lagi</button>
        <button class="btn btn-ghost" id="backMenuBtn">🏠 Kembali ke Menu</button>
      </div>
    </div>`;
  document.getElementById("exportCsvBtn").onclick = ()=>{ playSfx("click"); exportCSV(); renderFinal(); };
  document.getElementById("playAgainBtn").onclick = ()=>{
    if(!state.resultsExported && !confirm("Hasil belum diexport ke CSV. Jika lanjut, skor akan hilang. Yakin ingin Main Lagi tanpa menyimpan hasil?")) return;
    playSfx("click");
    state.teams.forEach(t=>t.score=0);
    state.history = [];
    state.resultsExported = false;
    state.currentRoundIdx=0; state.currentQIdxInRound=0;
    state.screen="roundIntro"; render();
  };
  document.getElementById("backMenuBtn").onclick = ()=>{
    if(!state.resultsExported && !confirm("Hasil belum diexport ke CSV. Jika lanjut, skor akan hilang. Yakin ingin kembali ke menu tanpa menyimpan hasil?")) return;
    playSfx("click");
    state.teams.forEach(t=>t.score=0);
    state.history = [];
    state.resultsExported = false;
    state.currentRoundIdx=0; state.currentQIdxInRound=0;
    state.screen="start"; render();
  };
}

function showToast(msg){
  const t = document.getElementById("soundToast");
  t.querySelector("span").textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---------------------------- 6. TEACHER CONTROL PANEL + PIN GATE ---------------------------- */

function renderTeacherDrawer(){
  const body = document.getElementById("drawerBody");
  const q = state.gameStarted && (state.screen==="question"||state.screen==="feedback") ? currentQuestion() : null;
  const r = state.gameStarted ? currentRound() : null;

  let answerBox = "";
  if(q){
    if(q.type==="mc"){
      answerBox = `<div class="drawer-answer-box"><b>Jawaban benar: ${q.correctAnswer}</b><br>${q.options["ABCD".indexOf(q.correctAnswer)]}<hr style="border-color:var(--border);opacity:.4;margin:8px 0;"><b>Pembahasan:</b><br>${q.explanation}</div>`;
    } else {
      answerBox = `<div class="drawer-answer-box"><b>Kunci:</b> ${q.answerKey||"-"}<hr style="border-color:var(--border);opacity:.4;margin:8px 0;"><b>Pembahasan:</b><br>${q.explanation}</div>`;
    }
  }

  body.innerHTML = `
    <div class="drawer-section" style="margin-top:0;padding-top:0;border-top:none;">
      <h4>Status</h4>
      <div style="font-size:13px;color:var(--muted);">${state.gameStarted ? (r.icon+" "+r.name+" — Soal "+(state.currentQIdxInRound+1)) : "Game belum dimulai"}</div>
    </div>

    ${state.gameStarted ? `
    <div class="drawer-section">
      <h4>Jawaban &amp; Pembahasan (khusus guru)</h4>
      ${answerBox || `<div style="font-size:13px;color:var(--muted);">Tidak ada soal aktif.</div>`}
    </div>

    <div class="drawer-section">
      <h4>Kontrol Timer</h4>
      <div class="drawer-btn-grid">
        <button class="btn btn-sm btn-ghost" id="tPause">⏸️ Pause</button>
        <button class="btn btn-sm btn-ghost" id="tResume">▶️ Resume</button>
        <button class="btn btn-sm btn-ghost" id="tResetTimer">🔁 Reset Timer</button>
        <button class="btn btn-sm btn-danger" id="tTimeUp">⏰ Paksa Time's Up</button>
      </div>
    </div>

    <div class="drawer-section">
      <h4>Navigasi Soal</h4>
      <div class="drawer-btn-grid">
        <button class="btn btn-sm btn-ghost" id="tPrev">⬅️ Soal Sebelumnya</button>
        <button class="btn btn-sm btn-ghost" id="tSkip">⏭️ Skip Soal</button>
        <button class="btn btn-sm btn-primary" id="tShowAnswer">👁️ Evaluasi Sekarang</button>
        <button class="btn btn-sm btn-ghost" id="tReturnMenu">🏠 Ke Menu Utama</button>
      </div>
    </div>

    <div class="drawer-section">
      <h4>Steal Zone</h4>
      <div style="font-size:12.5px;color:var(--muted);margin-bottom:8px;">Aktif hanya di Ronde 5. Steal saat ini dipilih manual oleh guru (Auto Steal berdasarkan kecepatan dinonaktifkan secara default).</div>
      <div class="drawer-btn-grid">
        <button class="btn btn-sm btn-ghost" id="tStealAuto" disabled>🎲 Auto-Steal (nonaktif)</button>
      </div>
    </div>

    <div class="drawer-section">
      <h4>Skor Manual (koreksi cepat)</h4>
      ${state.teams.map(t=>`
        <div class="point-adjust-row">
          <span class="pname">${t.name} — ${t.score}</span>
          <div class="pbtns">
            <button class="pbtn" data-team="${t.id}" data-delta="-5">−5</button>
            <button class="pbtn" data-team="${t.id}" data-delta="5">+5</button>
          </div>
        </div>`).join("")}
    </div>
    ` : ""}

    <div class="drawer-section">
      <h4>Nama Kelompok</h4>
      ${state.teams.map(t=>`<div class="team-name-edit"><input type="text" value="${t.name}" data-teamname="${t.id}"></div>`).join("")}
    </div>

    <div class="drawer-section">
      <h4>Reset</h4>
      <div class="drawer-btn-grid">
        <button class="btn btn-sm btn-danger" id="tResetScores">Reset Semua Skor</button>
        <button class="btn btn-sm btn-danger" id="tResetGame">Reset Total Game</button>
      </div>
    </div>
  `;

  const byId = id => document.getElementById(id);
  if(byId("tPause")) byId("tPause").onclick = ()=>{ pauseTimer(); };
  if(byId("tResume")) byId("tResume").onclick = ()=>{ resumeTimer(updateTimerDisplay, lockAndEvaluate); };
  if(byId("tResetTimer")) byId("tResetTimer").onclick = ()=>{ beginQuestionTimer(); };
  if(byId("tTimeUp")) byId("tTimeUp").onclick = ()=>{ if(!state.locked) lockAndEvaluate(); };
  if(byId("tSkip")) byId("tSkip").onclick = ()=>{ stopTimer(); if(state.screen==="feedback"){ goToNextQuestion(); } else { state.locked=true; state.revealed=true; state.screen="feedback"; state.lastDeltas={}; render(); } };
  if(byId("tPrev")) byId("tPrev").onclick = ()=>{
    if(state.currentQIdxInRound>0){ state.currentQIdxInRound-=1; resetPerQuestionState(); state.screen="question"; render(); beginQuestionTimer(); }
  };
  if(byId("tShowAnswer")) byId("tShowAnswer").onclick = ()=>{ if(!state.locked) lockAndEvaluate(); };
  if(byId("tReturnMenu")) byId("tReturnMenu").onclick = ()=>{ stopTimer(); stopBgMusic(); state.gameStarted=false; state.screen="start"; toggleDrawer(false); render(); };
  if(byId("tResetScores")) byId("tResetScores").onclick = ()=>{ state.teams.forEach(t=>t.score=0); state.history=[]; render(); };
  if(byId("tResetGame")) byId("tResetGame").onclick = ()=>{
    if(state.gameStarted && !state.resultsExported && !confirm("Hasil belum diexport ke CSV. Jika reset, skor akan hilang. Yakin ingin Reset Total Game?")) return;
    stopTimer(); stopBgMusic();
    state.teams.forEach(t=>t.score=0);
    state.history = [];
    state.resultsExported = false;
    state.currentRoundIdx=0; state.currentQIdxInRound=0; state.gameStarted=false;
    resetPerQuestionState();
    state.screen="start"; toggleDrawer(false); render();
  };
  document.querySelectorAll("[data-teamname]").forEach(inp=>{
    inp.addEventListener("input", e=>{
      const id = parseInt(e.target.dataset.teamname);
      state.teams[id].name = e.target.value || `Kelompok ${id+1}`;
    });
    inp.addEventListener("change", ()=>{ render(); });
  });
  document.querySelectorAll(".pbtn").forEach(btn=>{
    btn.onclick = ()=>{
      const id = parseInt(btn.dataset.team);
      const delta = parseInt(btn.dataset.delta);
      state.teams[id].score = Math.max(0, state.teams[id].score + delta);
      render();
    };
  });
}

function toggleDrawer(force){
  state.teacherOpen = typeof force==="boolean" ? force : !state.teacherOpen;
  document.getElementById("teacherDrawer").classList.toggle("open", state.teacherOpen);
  document.getElementById("drawerOverlay").classList.toggle("open", state.teacherOpen);
  document.getElementById("teacherToggleBtn").classList.toggle("active", state.teacherOpen);
}

/* ---- PIN modal ---- */
function openPinModal(){
  document.getElementById("pinOverlay").classList.add("open");
  const inp = document.getElementById("pinInput");
  inp.value = "";
  document.getElementById("pinError").style.display = "none";
  setTimeout(()=>inp.focus(), 60);
}
function closePinModal(){ document.getElementById("pinOverlay").classList.remove("open"); }
function submitPin(){
  const val = document.getElementById("pinInput").value;
  if(val === TEACHER_PIN){
    state.teacherAuthed = true;
    closePinModal();
    showToast("✓ Teacher Mode Aktif");
    toggleDrawer(true);
  } else {
    document.getElementById("pinError").style.display = "block";
    playSfx("wrong");
  }
}

/* ---------------------------- 8. INIT ---------------------------- */

document.getElementById("soundToggleBtn").addEventListener("click", ()=>{
  state.soundOn = !state.soundOn;
  if(state.soundOn){ ensureAudio(); startBgMusic(); } else { stopBgMusic(); }
  render();
});
document.getElementById("teacherToggleBtn").addEventListener("click", ()=>{
  if(state.teacherOpen){ toggleDrawer(false); return; }
  if(state.teacherAuthed){ toggleDrawer(true); return; }
  openPinModal();
});
document.getElementById("drawerOverlay").addEventListener("click", ()=>{ toggleDrawer(false); });
document.getElementById("pinSubmitBtn").addEventListener("click", submitPin);
document.getElementById("pinCancelBtn").addEventListener("click", closePinModal);
document.getElementById("pinInput").addEventListener("keydown", (e)=>{ if(e.key==="Enter") submitPin(); });

render();
</script>
